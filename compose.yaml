# Стек KTTF.
#
# Инфраструктура поднимается по умолчанию, приложения — профилем `apps`,
# наблюдаемость — профилем `observability`. Так `docker compose up` работает
# и сейчас, когда приложений ещё нет, и позже, когда они появятся.
#
# Все сервисы в одной сети kttf-net и общаются по именам контейнеров.
# Наружу открыто только то, что нужно с хоста: прокси и порты БД для миграций
# и отладки. Порты смещены, чтобы не конфликтовать с тем, что уже стоит
# на машине разработчика.

name: kttf

services:
  postgres:
    image: postgres:17-alpine
    container_name: kttf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER не задан}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB не задан}
      # Локаль под кириллицу: сортировка фамилий должна быть человеческой,
      # иначе «Ё» уезжает в конец, а регистр начинает влиять на порядок.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=ru-RU --encoding=UTF8'
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - kttf-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: kttf-redis
    restart: unless-stopped
    # appendonly: очередь обсчёта рейтинга не должна теряться при рестарте
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    networks:
      - kttf-net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: kttf-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER не задан}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD не задан}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    networks:
      - kttf-net
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---- Приложения. Профиль `apps` ----
  #
  # Пока kttf-back и kttf-front пусты, эти сервисы не собираются.
  # Убрать `profiles`, когда в них появятся приложения и Dockerfile.

  api:
    build:
      context: ../kttf-back
      dockerfile: Dockerfile
    image: ghcr.io/goats-web-studio/kttf-api:${IMAGE_TAG:-local}
    container_name: kttf-api
    restart: unless-stopped
    profiles: [apps]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Внутри сети обращение идёт по имени сервиса и штатному порту,
      # смещённые порты хоста здесь ни при чём.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      PORT: 3000
    networks:
      - kttf-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ../kttf-front
      dockerfile: Dockerfile
    image: ghcr.io/goats-web-studio/kttf-web:${IMAGE_TAG:-local}
    container_name: kttf-web
    restart: unless-stopped
    profiles: [apps]
    networks:
      - kttf-net

  proxy:
    image: caddy:2-alpine
    container_name: kttf-proxy
    restart: unless-stopped
    profiles: [apps]
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      KTTF_DOMAIN: ${KTTF_DOMAIN:-localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - kttf-net
    depends_on:
      - api
      - web

  # ---- Наблюдаемость. Профиль `observability` ----
  #
  # Локально не нужна и только ест память, в проде обязательна (ТС 8.5).

  prometheus:
    image: prom/prometheus:latest
    container_name: kttf-prometheus
    restart: unless-stopped
    profiles: [observability]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - kttf-net

  grafana:
    image: grafana/grafana:latest
    container_name: kttf-grafana
    restart: unless-stopped
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    ports:
      - '${GRAFANA_PORT:-3001}:3000'
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - kttf-net

networks:
  kttf-net:
    name: kttf-net
    driver: bridge
    ipam:
      config:
        # Явная подсеть, а не выданная Docker наугад: адрес не меняется
        # между пересозданиями, и его можно прописывать в правилах firewall.
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

volumes:
  postgres-data:
    name: kttf-postgres-data
  redis-data:
    name: kttf-redis-data
  minio-data:
    name: kttf-minio-data
  caddy-data:
    name: kttf-caddy-data
  caddy-config:
    name: kttf-caddy-config
  prometheus-data:
    name: kttf-prometheus-data
  grafana-data:
    name: kttf-grafana-data
