# Стек KTTF.
#
# `docker compose up -d` поднимает продукт целиком: базу, кэш, хранилище
# файлов, миграции, API, статику и прокси. Наблюдаемость остаётся за
# профилем `observability` — локально она не нужна и только ест память.
#
# Имя сервиса совпадает с именем контейнера: одна сущность — одно имя
# везде, включая внутренний DNS и интерфейс Docker Desktop. Иначе на каждый
# сервис приходится по два имени, и в списке контейнеров видно не то.
#
# Все сервисы в одной сети kttf-net и общаются по этим именам.
# Наружу открыто только то, что нужно с хоста: прокси и порты БД для миграций
# и отладки. Порты смещены, чтобы не конфликтовать с тем, что уже стоит
# на машине разработчика.

name: kttf

services:
  kttf-postgres:
    image: postgres:17-alpine
    container_name: kttf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER не задан}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB не задан}
      # Локаль под кириллицу: сортировка фамилий должна быть человеческой,
      # иначе «Ё» уезжает в конец, а регистр начинает влиять на порядок.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=ru-RU --encoding=UTF8'
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - kttf-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  kttf-redis:
    image: redis:7-alpine
    container_name: kttf-redis
    restart: unless-stopped
    # appendonly: очередь обсчёта рейтинга не должна теряться при рестарте
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    networks:
      - kttf-net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  kttf-minio:
    image: minio/minio:latest
    container_name: kttf-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER не задан}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD не задан}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    networks:
      - kttf-net
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---- Приложения ----

  # Схему накатывает отдельный разовый контейнер, а не API при старте
  # (ADR-030): при нескольких копиях приложения миграция обязана пройти
  # ровно один раз, а её отказ — быть виден отдельно от отказа приложения.
  kttf-migrate:
    build:
      context: ../kttf-back
      dockerfile: Dockerfile
      target: migrator
    image: ghcr.io/goats-web-studio/kttf-migrate:${IMAGE_TAG:-local}
    container_name: kttf-migrate
    # Задача, а не служба: отработала — завершилась. Перезапуск означал бы
    # бесконечный цикл миграции при первой же ошибке в ней.
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@kttf-postgres:5432/${POSTGRES_DB}?schema=public
    networks:
      - kttf-net
    depends_on:
      kttf-postgres:
        condition: service_healthy

  kttf-api:
    build:
      context: ../kttf-back
      dockerfile: Dockerfile
      target: runtime
    image: ghcr.io/goats-web-studio/kttf-api:${IMAGE_TAG:-local}
    container_name: kttf-api
    restart: unless-stopped
    environment:
      # При `production` приложение намеренно не поднимется, пока нет
      # провайдера SMS: код входа уходит в лог, и это дыра (ADR-013, ОВ-9).
      NODE_ENV: ${NODE_ENV:-production}
      # Внутри сети обращение идёт по имени сервиса и штатному порту,
      # смещённые порты хоста здесь ни при чём.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@kttf-postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://kttf-redis:6379
      S3_ENDPOINT: http://kttf-minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # Ключи подписи. Без них приложение падает на разборе окружения —
      # так и задумано: неверное окружение видно при запуске, а не на
      # первом запросе.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET не задан}
      AUTH_CODE_SECRET: ${AUTH_CODE_SECRET:?AUTH_CODE_SECRET не задан}
      PORT: 3000
    networks:
      - kttf-net
    healthcheck:
      test:
        ['CMD', 'wget', '--spider', '--quiet', 'http://127.0.0.1:3000/api/v1/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      # Схема должна быть накатана до старта, иначе первый же запрос уйдёт
      # в базу без таблиц.
      kttf-migrate:
        condition: service_completed_successfully
      kttf-redis:
        condition: service_healthy
      kttf-minio:
        condition: service_healthy

  kttf-web:
    build:
      context: ../kttf-front
      dockerfile: Dockerfile
      target: runtime
    image: ghcr.io/goats-web-studio/kttf-web:${IMAGE_TAG:-local}
    container_name: kttf-web
    restart: unless-stopped
    networks:
      - kttf-net

  kttf-proxy:
    image: caddy:2-alpine
    container_name: kttf-proxy
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      KTTF_DOMAIN: ${KTTF_DOMAIN:-localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - kttf-net
    depends_on:
      kttf-api:
        condition: service_healthy
      kttf-web:
        condition: service_started

  # ---- Наблюдаемость. Профиль `observability` ----
  #
  # Локально не нужна и только ест память, в проде обязательна (ТС 8.5).

  kttf-prometheus:
    image: prom/prometheus:latest
    container_name: kttf-prometheus
    restart: unless-stopped
    profiles: [observability]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - kttf-net

  kttf-grafana:
    image: grafana/grafana:latest
    container_name: kttf-grafana
    restart: unless-stopped
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    ports:
      - '${GRAFANA_PORT:-3001}:3000'
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - kttf-net

networks:
  kttf-net:
    name: kttf-net
    driver: bridge
    ipam:
      config:
        # Явная подсеть, а не выданная Docker наугад: адрес не меняется
        # между пересозданиями, и его можно прописывать в правилах firewall.
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

volumes:
  postgres-data:
    name: kttf-postgres-data
  redis-data:
    name: kttf-redis-data
  minio-data:
    name: kttf-minio-data
  caddy-data:
    name: kttf-caddy-data
  caddy-config:
    name: kttf-caddy-config
  prometheus-data:
    name: kttf-prometheus-data
  grafana-data:
    name: kttf-grafana-data
