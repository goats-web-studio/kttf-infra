# Метрики KTTF. Профиль observability.
# Что собирать по существу — ТС 8.5: активные турниры, операции синхронизации,
# отказы оплаты, застрявшая очередь обсчёта рейтинга.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: kttf-api
    metrics_path: /api/metrics
    static_configs:
      - targets: ['kttf-api:3000']
